<!-- Eveom Garantie-Hinweis · eigenständiger HTML-Code (z. B. CrispCheckout „Custom HTML“) · Sprache nach Browser (de / nl / sonst en) – ohne <script>, funktioniert auch in CrispCheckout -->
<div class="eveom-g-wrap">
  <div class="eveom-g">
    <svg class="eveom-g__icon" viewBox="0 0 64 72" fill="none" aria-hidden="true" focusable="false">
      <g class="eveom-g__band" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round">
        <path d="M22.5 43.5 13 63.5l7.4-1.6 3.6 6.6 8.2-18.6"/>
        <path d="M41.5 43.5 51 63.5l-7.4-1.6-3.6 6.6-8.2-18.6"/>
      </g>
      <g stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
        <path class="eveom-g__kreis" d="M46.6 18.2A19 19 0 1 1 40 9.4"/>
        <path d="m23.5 27.5 6.5 6.5 12.5-13"/>
      </g>
    </svg>
    <p class="eveom-g__text">
      <span class="eveom-g__en"><strong>Less than 1%</strong> of customers use <br>Eveom™ Money Back Guarantee</span>
      <span class="eveom-g__de"><strong>Weniger als 1&nbsp;%</strong> der Kunden nutzen die <br>Eveom™ Geld-zurück-Garantie</span>
      <span class="eveom-g__nl"><strong>Minder dan 1%</strong> van de klanten gebruikt de <br>Eveom™ Geld-terug-garantie</span>
    </p>
  </div>
  <img class="eveom-g__lang" alt="" width="1" height="1" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" onload="var w=this.parentNode,l=navigator.languages,c='en';if(!l||!l.length)l=[navigator.language||''];for(var i=0;i<l.length;i++){var x=String(l[i]).slice(0,2).toLowerCase();if(x=='de'||x=='nl'||x=='en'){c=x;break}}w.querySelector('.eveom-g').setAttribute('lang',c);">
</div>

<style>
  .eveom-g-wrap { position: relative; container-type: inline-size; width: 100%; margin: 12px 0; }
  .eveom-g-wrap .eveom-g { box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; margin: 0; padding: 12px 16px; background: #ffffff; border: 1.5px solid #7d000d; border-radius: 10px; color: #7d000d; }
  .eveom-g-wrap .eveom-g__icon { flex: 0 0 auto; display: block; width: 36px; height: 41px; margin: 0; stroke: #7d000d; }
  .eveom-g-wrap .eveom-g__band { fill: #ffffff; stroke-opacity: .45; }
  .eveom-g-wrap .eveom-g__kreis { fill: #ffffff; }
  .eveom-g-wrap .eveom-g__lang { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .eveom-g-wrap .eveom-g__text { flex: 0 1 auto; min-width: 0; margin: 0; padding: 0; font-family: inherit; font-size: 14.5px; font-weight: 400; line-height: 1.35; letter-spacing: 0; text-transform: none; text-align: left; color: #7d000d; }
  .eveom-g-wrap .eveom-g__text strong { font-weight: 700; color: inherit; }

  /* Sprache: nur der passende Text ist sichtbar (Standard Englisch) */
  .eveom-g-wrap .eveom-g__text span { display: none; }
  .eveom-g-wrap .eveom-g:not(:lang(de)):not(:lang(nl)) .eveom-g__en,
  .eveom-g-wrap .eveom-g:lang(de) .eveom-g__de,
  .eveom-g-wrap .eveom-g:lang(nl) .eveom-g__nl { display: inline; }

  /* Breiter Platz (z. B. Shopseite): etwas größer */
  @container (min-width: 640px) {
    .eveom-g-wrap .eveom-g { gap: 16px; padding: 16px 20px; border-radius: 12px; }
    .eveom-g-wrap .eveom-g__icon { width: 46px; height: 52px; }
    .eveom-g-wrap .eveom-g__text { font-size: 18px; }
  }
  /* Schmaler Platz (Handy): Text frei umbrechen */
  @container (max-width: 400px) {
    .eveom-g-wrap .eveom-g { gap: 10px; padding: 10px 12px; }
    .eveom-g-wrap .eveom-g__icon { width: 30px; height: 34px; }
    .eveom-g-wrap .eveom-g__text { font-size: 13px; text-wrap: balance; }
    .eveom-g-wrap .eveom-g__text br { display: none; }
  }

  /* CrispCheckout: Fußzeile „Secure checkout by CrispCheckout · Payments by Whop“ ausblenden */
  main footer.border-t > p.text-xs { display: none !important; }
  main footer.border-t:not(:has(a)) { display: none !important; }
</style>
