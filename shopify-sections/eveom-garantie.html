<!-- Eveom Garantie-Hinweis · eigenständiger HTML-Code (ohne Liquid) · Sprache nach Browser: de / nl / sonst en -->
<div class="eveom-garantie" lang="en">
  <svg class="eveom-garantie__icon" viewBox="0 0 64 72" fill="none" aria-hidden="true" focusable="false">
    <g class="eveom-garantie__band" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M22.5 43.5 13 63.5l7.4-1.6 3.6 6.6 8.2-18.6"/>
      <path d="M41.5 43.5 51 63.5l-7.4-1.6-3.6 6.6-8.2-18.6"/>
    </g>
    <g stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path class="eveom-garantie__kreis" d="M46.6 18.2A19 19 0 1 1 40 9.4"/>
      <path d="m23.5 27.5 6.5 6.5 12.5-13"/>
    </g>
  </svg>
  <p class="eveom-garantie__text">
    <span data-lang="en"><strong>Less than 1%</strong> of customers use <br>Eveom™ Money Back Guarantee</span>
    <span data-lang="de" hidden><strong>Weniger als 1&nbsp;%</strong> der Kunden nutzen die <br>Eveom™ Geld-zurück-Garantie</span>
    <span data-lang="nl" hidden><strong>Minder dan 1%</strong> van de klanten gebruikt de <br>Eveom™ Geld-terug-garantie</span>
  </p>
</div>

<style>
  .eveom-garantie { box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 22px; width: 100%; max-width: 980px; margin: 16px auto; padding: 22px 24px; background: #ffffff; border: 1.5px solid #7d000d; border-radius: 14px; color: #7d000d; }
  .eveom-garantie__icon { flex: 0 0 auto; width: 78px; height: 88px; margin: -6px 0; stroke: #7d000d; }
  .eveom-garantie__band { fill: #ffffff; stroke-opacity: .45; }
  .eveom-garantie__kreis { fill: #ffffff; }
  .eveom-garantie__text { margin: 0; font-family: inherit; font-size: 26px; font-weight: 400; line-height: 1.32; letter-spacing: 0; text-transform: none; text-align: left; color: #7d000d; }
  .eveom-garantie__text strong { font-weight: 700; color: inherit; }
  .eveom-garantie__text [hidden] { display: none !important; }
  @media (max-width: 749px) {
    .eveom-garantie { gap: 14px; padding: 16px 14px; border-radius: 12px; }
    .eveom-garantie__icon { width: 52px; height: 59px; margin: -4px 0; }
    .eveom-garantie__text { font-size: 16px; text-wrap: balance; }
    .eveom-garantie__text br { display: none; }
  }
  @media (max-width: 380px) { .eveom-garantie__text { font-size: 14.5px; } }
</style>

<script>
(function () {
  var liste = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
  var lang = "en";
  for (var i = 0; i < liste.length; i++) {
    var code = String(liste[i] || "").slice(0, 2).toLowerCase();
    if (code === "de" || code === "nl" || code === "en") { lang = code; break; }
  }
  document.querySelectorAll(".eveom-garantie").forEach(function (box) {
    box.setAttribute("lang", lang);
    box.querySelectorAll("[data-lang]").forEach(function (el) { el.hidden = el.getAttribute("data-lang") !== lang; });
  });
})();
</script>
