name: Info-Mail senden

# Startet automatisch, sobald eine Auftragsdatei in ebook-automation/auftraege/
# neu hochgeladen oder geändert wird. Erklärung: ebook-automation/README.md,
# Abschnitt "Info-Mails".
on:
  push:
    branches: [main]
    paths: ['ebook-automation/auftraege/*.json']
  workflow_dispatch:
    inputs:
      auftrag:
        description: 'Auftragsdatei, z. B. auftraege/2026-10-21-zahlung.json'
        required: true
        type: string
      modus:
        description: 'Leer = Modus aus der Datei. vorschau / test / senden'
        type: string
        default: ''

concurrency:
  group: info-mail
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  senden:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: ebook-automation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ebook-automation/package-lock.json
      - run: npm ci --omit=dev
      - name: Aufträge bestimmen
        id: auftraege
        env:
          BEFORE: ${{ github.event.before }}
          MANUELL: ${{ inputs.auftrag }}
        run: |
          if [ -n "$MANUELL" ]; then
            files="$MANUELL"
          else
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- auftraege/ | grep '\.json$' | sed 's#^ebook-automation/##' | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Aufträge: ${files:-keine}"
      - if: steps.auftraege.outputs.files != ''
        run: node src/info.js $FILES ${MODUS:+--modus "$MODUS"}
        env:
          FILES: ${{ steps.auftraege.outputs.files }}
          MODUS: ${{ inputs.modus }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
